<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laia · Portfolio</title>
<meta name="description" content="Portfolio profesional de Laia – 2º SMX · Professional portfolio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>

<header class="top">
  <a class="logo" href="#" aria-label="Laia">LAIA<span class="spark">✦</span></a>
  <nav id="menu" aria-label="Main">
    <a href="#about"    data-sec="about"><i class="dot"></i><span data-i18n="nav_about"></span></a>
    <a href="#resume"   data-sec="resume"><i class="dot"></i><span data-i18n="nav_resume"></span></a>
    <a href="#certs"    data-sec="certs"><i class="dot"></i><span data-i18n="nav_certs"></span></a>
    <a href="#projects" data-sec="projects"><i class="dot"></i><span data-i18n="nav_projects"></span></a>
    <a href="#hhep"     data-sec="hhep"><i class="dot"></i><span data-i18n="nav_hhep"></span></a>
    <a href="#contact"  data-sec="contact"><i class="dot"></i><span data-i18n="nav_contact"></span></a>
  </nav>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="es">ES</button><button data-lang="en">EN</button>
  </div>
  <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
</header>

<main class="stage" id="stage">
  <canvas id="world" aria-label="Mundo 3D interactivo"></canvas>
  <div id="markers"></div>

  <div class="intro" id="intro">
    <p class="eyebrow" data-i18n="hero_eyebrow"></p>
    <h1 data-i18n="hero_title"></h1>
    <p class="lead" data-i18n="hero_lead"></p>
    <div class="cta">
      <a class="btn" href="#about" data-i18n="intro_cta"></a>
      <button class="btn ghost" id="explore" data-i18n="intro_explore"></button>
    </div>
  </div>

  <div class="hint" id="hint"><span class="hand">👆</span><span data-i18n="hint"></span></div>

  <div class="loader" id="loader">
    <div class="logo big">LAIA<span class="spark">✦</span></div>
    <div class="bar"><i id="loadbar"></i></div>
  </div>

  <noscript><p class="nojs">Activa JavaScript para ver el mundo 3D · Enable JavaScript to see the 3D world.</p></noscript>
</main>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="panelTitle">
  <button class="close" id="close" aria-label="Cerrar / Close">✕</button>

  <!-- ============ ABOUT ME ============ -->
  <section class="sheet" data-sec="about">
    <div class="me">
      <div class="photo"><img src="foto.jpg" alt="Laia"></div>
      <div>
        <p class="eyebrow" data-i18n="hero_eyebrow"></p>
        <h2 id="panelTitle" data-i18n="about_title"></h2>
        <p class="lead" data-i18n="hero_lead"></p>
      </div>
    </div>

    <h3 class="h"><span class="em">👋</span><span data-i18n="who_h"></span></h3>
    <div class="card"><p data-i18n="who_p1"></p><p data-i18n="who_p2"></p></div>

    <h3 class="h"><span class="em">🧰</span><span data-i18n="skills_h"></span></h3>
    <div class="card">
      <h4 data-i18n="hard_h"></h4>
      <p class="muted" data-i18n="hard_sub"></p>
      <div id="hardBars"></div>
    </div>
    <div class="card">
      <h4 data-i18n="soft_h"></h4>
      <p class="muted" data-i18n="soft_sub"></p>
      <div class="tags" id="softTags"></div>
    </div>

    <h3 class="h"><span class="em">🌱</span><span data-i18n="para_h"></span></h3>
    <p class="muted" data-i18n="para_sub"></p>
    <div class="paradigm" id="paradigm"></div>
    <div class="paradigm-list" id="paradigmList"></div>
  </section>

  <!-- Secciones vacías por ahora -->
  <section class="sheet" data-sec="resume">
    <p class="eyebrow" data-i18n="hero_eyebrow"></p>
    <h2 data-i18n="nav_resume"></h2>
    <p class="muted" data-i18n="cv_sub"></p>
    <div class="cvs">
      <div class="cv">
        <a href="cv-laia.pdf" target="_blank" rel="noopener" class="cv-prev"><object data="cv-laia.pdf#toolbar=0&view=FitH" type="application/pdf" tabindex="-1"></object><span class="cv-tag">PDF</span></a>
        <h4 data-i18n="cv1_t"></h4><p class="muted" data-i18n="cv1_d"></p>
        <div class="cta"><a class="btn" href="cv-laia.pdf" target="_blank" rel="noopener" data-i18n="cv_open"></a><a class="btn ghost" href="cv-laia.pdf" download data-i18n="cv_dl"></a></div>
      </div>
      <div class="cv">
        <a href="cv-europass.pdf" target="_blank" rel="noopener" class="cv-prev"><object data="cv-europass.pdf#toolbar=0&view=FitH" type="application/pdf" tabindex="-1"></object><span class="cv-tag">PDF</span></a>
        <h4 data-i18n="cv2_t"></h4><p class="muted" data-i18n="cv2_d"></p>
        <div class="cta"><a class="btn" href="cv-europass.pdf" target="_blank" rel="noopener" data-i18n="cv_open"></a><a class="btn ghost" href="cv-europass.pdf" download data-i18n="cv_dl"></a></div>
      </div>
    </div>
  </section>
  <section class="sheet" data-sec="certs">
    <p class="eyebrow" data-i18n="hero_eyebrow"></p>
    <h2 data-i18n="nav_certs"></h2>
    <p class="muted" data-i18n="cert_sub"></p>
    <a class="btn drive" id="driveLink" href="#" target="_blank" rel="noopener" hidden><span>📁</span><span data-i18n="cert_drive"></span></a>
    <div class="certs" id="certGrid"></div>
  </section>
  <section class="sheet" data-sec="projects">
    <p class="eyebrow" data-i18n="hero_eyebrow"></p>
    <h2 data-i18n="nav_projects"></h2>
    <p class="muted" data-i18n="proj_sub"></p>
    <div class="projs" id="projGrid"></div>
  </section>
  <section class="sheet soon" data-sec="hhep"><div class="big-em">💡</div><h2 data-i18n="nav_hhep"></h2><p class="muted" data-i18n="soon"></p></section>
  <section class="sheet soon" data-sec="contact"><div class="big-em">✉️</div><h2 data-i18n="nav_contact"></h2><p class="muted" data-i18n="soon"></p></section>
</aside>

<div class="lightbox" id="lightbox" hidden><button class="close" id="lbClose" aria-label="Cerrar / Close">✕</button><img id="lbImg" alt=""><p id="lbCap"></p></div>

<footer class="foot"><span data-i18n="foot"></span> · 2026</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="i18n.js?v=8"></script>
<script src="props.js?v=8"></script>
<script src="world.js?v=8"></script>
<script src="app.js?v=8"></script>
</body>
</html>
