        <a class="btn ghost" href="#resume" data-i18n="hero_cta2"></a>
      </div>
    </div>
    <div class="hero-photo tilt">

    <div class="cube"><i>Windows</i><i>Linux</i><i>Redes</i><i>Hardware</i><i>Cloud</i><i>Security</i></div>

  <p class="muted center" data-i18n="para_sub"></p>
  <div class="paradigm glass" id="paradigm"></div>
